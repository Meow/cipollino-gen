# Creates a draft GitHub release of one commit, with the programs CI built from it attached.
#
# Started by hand: Actions -> Release -> Run workflow, on the branch to release. The
# release is tagged v<VERSION>, from that commit's VERSION file. Nothing is compiled here:
# the Windows program comes from the "Windows build" run of that very commit, so what is
# released is what was tested. The release stays a draft until you publish it; only then
# is its tag created, which in turn builds the container images for that version.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: write  # create the release
  actions: read    # fetch the build's artifact

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Read the version
        run: |
          version=$(gh api "repos/$GH_REPO/contents/VERSION?ref=$GITHUB_SHA" --jq .content | base64 -d | tr -d '[:space:]')
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::VERSION holds '$version', which is not a version number"
            exit 1
          fi
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::error::v$version has a release already: raise VERSION first."
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Find the Windows build of this commit
        id: build
        run: |
          run=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" \
                  --jq '[.workflow_runs[] | select(.path == ".github/workflows/windows.yml")][0].id // empty')
          if [ -z "$run" ]; then
            echo "::error::No successful Windows build of $GITHUB_SHA: run the Windows build on this commit first."
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Fetch and pack it
        env:
          RUN: ${{ steps.build.outputs.run }}
        run: |
          gh run download "$RUN" --name cipollino-windows-x64 --dir "cipollino-$TAG-windows-x64"
          mkdir assets
          zip -r "assets/cipollino-$TAG-windows-x64.zip" "cipollino-$TAG-windows-x64"
          (cd assets && sha256sum -- * > SHA256SUMS)

      - name: Create the draft
        run: |
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "cipollino $TAG" \
            --generate-notes assets/*

<text x="280.0" y="131.0" font-size="12" font-weight="600" text-anchor="start" fill="#0b0b0b">12 nJ</text>
<text x="280.0" y="148.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">850 other instructions</text>
<rect x="500.0" y="122.0" width="10.0" height="10.0" rx="2" fill="#1baf7a"/>
<text x="516.0" y="131.0" font-size="12" font-weight="600" text-anchor="start" fill="#0b0b0b">5 to 8 nJ</text>
<text x="516.0" y="148.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">scratch memory traffic</text>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="206" viewBox="0 0 760 206" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-label="Radeon 610M keys per second before and after, Vulkan and ROCm">
<rect x="0.5" y="0.5" width="759.0" height="205.0" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="28.0" y="34.0" font-size="15" font-weight="600" text-anchor="start" fill="#0b0b0b">One AMD GPU, two APIs</text>
<text x="28.0" y="54.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">Radeon 610M, million keys per second, before and after the work described below.</text>
<line x1="170.0" y1="88.0" x2="170.0" y2="170.0" stroke="#c3c2b7" stroke-width="1" stroke-linecap="round"/>
<text x="170.0" y="188.0" font-size="11" font-weight="400" text-anchor="middle" fill="#898781">0</text>
<line x1="290.0" y1="88.0" x2="290.0" y2="170.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="290.0" y="188.0" font-size="11" font-weight="400" text-anchor="middle" fill="#898781">30 M</text>
<line x1="410.0" y1="88.0" x2="410.0" y2="170.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="410.0" y="188.0" font-size="11" font-weight="400" text-anchor="middle" fill="#898781">60 M</text>
<line x1="530.0" y1="88.0" x2="530.0" y2="170.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="530.0" y="188.0" font-size="11" font-weight="400" text-anchor="middle" fill="#898781">90 M</text>
<line x1="650.0" y1="88.0" x2="650.0" y2="170.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="650.0" y="188.0" font-size="11" font-weight="400" text-anchor="middle" fill="#898781">120 M</text>
<circle cx="34.0" cy="72.0" r="5" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
<text x="46.0" y="76.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">before</text>
<circle cx="118.0" cy="72.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="130.0" y="76.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">after</text>
<text x="156.0" y="114.0" font-size="12" font-weight="400" text-anchor="end" fill="#52514e">Vulkan (Mesa)</text>
<line x1="342.0" y1="110.0" x2="530.0" y2="110.0" stroke="#86b6ef" stroke-width="2" stroke-linecap="round"/>
<circle cx="342.0" cy="110.0" r="5" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="530.0" cy="110.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="330.0" y="114.0" font-size="12" font-weight="400" text-anchor="end" fill="#52514e">43 M</text>
<text x="542.0" y="114.0" font-size="12" font-weight="600" text-anchor="start" fill="#0b0b0b">90 M</text>
<text x="156.0" y="148.0" font-size="12" font-weight="400" text-anchor="end" fill="#52514e">ROCm</text>
<line x1="554.0" y1="144.0" x2="590.0" y2="144.0" stroke="#86b6ef" stroke-width="2" stroke-linecap="round"/>
<circle cx="554.0" cy="144.0" r="5" fill="#86b6ef" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="590.0" cy="144.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="542.0" y="148.0" font-size="12" font-weight="400" text-anchor="end" fill="#52514e">96 M</text>
<text x="602.0" y="148.0" font-size="12" font-weight="600" text-anchor="start" fill="#0b0b0b">105 M</text>
</svg>

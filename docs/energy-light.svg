<text x="28.0" y="34.0" font-size="15" font-weight="600" text-anchor="start" fill="#0b0b0b">Where a key pair's energy goes on an RTX 4090</text>
<text x="28.0" y="54.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">About 55 nanojoules per pair at the card's 450 W limit.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="176" viewBox="0 0 760 176" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-label="Energy per key pair on an RTX 4090 by where it goes">

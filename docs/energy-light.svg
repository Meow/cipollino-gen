<rect x="514.4" y="78.0" width="151.6" height="24.0" rx="0" fill="#eb6834"/>
<path d="M668.0,78 H728.0 Q732.0,78 732.0,82 V98 Q732.0,102 728.0,102 H668.0 Z" fill="#1baf7a"/>
<rect x="28.0" y="122.0" width="10.0" height="10.0" rx="2" fill="#2a78d6"/>
<text x="44.0" y="131.0" font-size="12" font-weight="600" text-anchor="start" fill="#0b0b0b">38 nJ</text>
<text x="44.0" y="148.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">950 wide multiply-adds</text>

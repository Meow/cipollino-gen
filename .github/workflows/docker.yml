# Builds the two container images and publishes them to the GitHub Container Registry.
#
#   ghcr.io/<owner>/<repo>:latest        CUDA + Vulkan   (Dockerfile)
#   ghcr.io/<owner>/<repo>:rocm          ROCm + Vulkan   (Dockerfile.rocm)
#
# Those two tags come from the default branch. Other branches publish <branch> and
# <branch>-rocm, version tags (v1.2.3) publish 1.2.3, 1.2 and 1.2.3-rocm, 1.2-rocm.
# Pull requests are built but not published.
#
# The Dockerfiles run the test suite that needs no GPU (`make test-host`) as part of the
# build, so a red build here also means a failing test.

name: Docker images

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CUDA + Vulkan
            dockerfile: Dockerfile
            suffix: ''
            default-tag: latest
          - name: ROCm + Vulkan
            dockerfile: Dockerfile.rocm
            suffix: -rocm
            default-tag: rocm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.default-tag }},enable={{is_default_branch}}
            type=ref,event=branch,suffix=${{ matrix.suffix }}
            type=ref,event=pr,suffix=${{ matrix.suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}

      - name: Build, test and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
